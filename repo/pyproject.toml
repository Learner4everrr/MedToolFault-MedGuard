[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medtoolbench"
version = "0.1.0"
description = "Local, stateful clinical-tool reliability experiments"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["medtoolbench*"]
